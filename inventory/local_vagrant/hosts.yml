---
# Kubespray inventory for the local Vagrant lab.
# Low-resource demo: knode1 is the sole control-plane + etcd AND a worker;
# knode2/knode3 are workers only. All three are kube_node so storage
# workloads (future MinIO + DirectPV) get 3 nodes x 2 disks.
all:
  hosts:
    knode1:
      ansible_host: 192.168.56.111
      ip: 192.168.56.111
      access_ip: 192.168.56.111
    knode2:
      ansible_host: 192.168.56.112
      ip: 192.168.56.112
      access_ip: 192.168.56.112
    knode3:
      ansible_host: 192.168.56.113
      ip: 192.168.56.113
      access_ip: 192.168.56.113
  children:
    kube_control_plane:
      hosts:
        knode1:
    etcd:
      hosts:
        knode1:
    kube_node:
      hosts:
        knode1:
        knode2:
        knode3:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    calico_rr:
      hosts: {}
