---
# Kubespray inventory for the local Vagrant lab.
# cp1: control-plane + etcd only (tainted, not schedulable).
# kn1/kn2/kn3: workers (kube_node) + storage nodes for the
# future MinIO + DirectPV playbook (3 nodes x 2 disks).
all:
  hosts:
    cp1:
      ansible_host: 192.168.56.111
      ip: 192.168.56.111
      access_ip: 192.168.56.111
    kn1:
      ansible_host: 192.168.56.112
      ip: 192.168.56.112
      access_ip: 192.168.56.112
    kn2:
      ansible_host: 192.168.56.113
      ip: 192.168.56.113
      access_ip: 192.168.56.113
    kn3:
      ansible_host: 192.168.56.114
      ip: 192.168.56.114
      access_ip: 192.168.56.114
  children:
    kube_control_plane:
      hosts:
        cp1:
    etcd:
      hosts:
        cp1:
    kube_node:
      hosts:
        kn1:
        kn2:
        kn3:
    k8s_cluster:
      children:
        kube_control_plane:
        kube_node:
    calico_rr:
      hosts: {}
    storage_nodes:
      hosts:
        kn1:
        kn2:
        kn3:
