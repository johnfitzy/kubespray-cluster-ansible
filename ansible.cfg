[defaults]
# Resolve our own roles plus Kubespray's (vendored submodule, pinned v2.31.0).
roles_path = ./roles:./kubespray/roles
# Kubespray ships custom modules under library/ and plugins/modules/.
library = ./kubespray/library:./kubespray/plugins/modules
# Kubespray creates dynamic groups containing '-' and '.'; ignore the warnings.
force_valid_group_names = ignore

host_key_checking = False
remote_user = vagrant
deprecation_warnings = False
timeout = 300

# Cache facts so re-runs skip re-gathering.
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 86400

# Run tasks across hosts in parallel.
forks = 10

inventory_ignore_extensions = ~, .orig, .bak, .ini, .cfg, .retry, .pyc, .pyo, .creds, .gpg

[inventory]
# Kubespray writes kubeconfig/credentials into the inventory dir.
ignore_patterns = artifacts, credentials

[ssh_connection]
# Pipelining sends module code over stdin instead of SCP -- big speedup.
pipelining = True
# Reuse SSH connections; /tmp avoids issues with read-only mounts in devcontainers.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o ControlPath=/tmp/ansible-ssh-%h-%p-%r -o ConnectTimeout=10 -o UserKnownHostsFile=/dev/null
